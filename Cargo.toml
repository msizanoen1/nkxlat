[package]
name = "nkxlat"
version = "0.1.0"
edition = "2024"

[build-dependencies]
libbpf-cargo = "0.27.2"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libbpf-rs = "0.27.2"
netlink-bindings = { version = "0.3.5", features = ["rt-link"] }
netlink-socket2 = "0.3.5"
nix = { version = "0.31.3", features = ["net", "sched"] }
sd-notify = { path = "third_party/sd-notify" }

[workspace]
members = ["third_party/sd-notify"]
